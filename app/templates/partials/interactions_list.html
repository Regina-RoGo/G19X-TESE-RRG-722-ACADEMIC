{% if interactions %}
    {% for interaction in interactions %}
    <div class="border-l-4 border-primary/40 pl-3 py-1">
        <div class="flex justify-between items-baseline flex-wrap gap-2">
            <span class="badge badge-outline">{{ interaction.interaction_type.name }}</span>
            <span class="text-xs text-base-content/60">
                {{ interaction.occurred_at.strftime("%d/%m/%Y %H:%M") }} · {{ interaction.user.full_name }}
            </span>
        </div>
        <p class="mt-1 whitespace-pre-wrap">{{ interaction.notes }}</p>
    </div>
    {% endfor %}
{% else %}
    <p class="text-base-content/60">Aún no hay interacciones registradas.</p>
{% endif %}
