{% extends "base.html" %}

{% block title %}Clientes - CRM Inteligente{% endblock %}

{% block content %}
<div class="flex flex-wrap justify-between items-center gap-4 mb-4">
    <h1 class="text-2xl font-bold">Clientes</h1>

    <form id="customer-filters" class="flex flex-wrap items-center gap-2"
          hx-get="/fragments/customers-table"
          hx-trigger="input delay:400ms from:#customer-search, change"
          hx-target="#customers-table-body"
          hx-swap="innerHTML"
          hx-indicator="#customers-spinner"
          onsubmit="return false">
        <span id="customers-spinner" class="htmx-indicator loading loading-spinner loading-sm"></span>
        <select name="tag" class="select select-bordered select-sm" aria-label="Filtrar por tag">
            <option value="">Todos los tags</option>
            {% for name in tag_names %}
            <option value="{{ name }}" {{ "selected" if name == selected_tag }}>{{ name }}</option>
            {% endfor %}
        </select>
        <select name="churn" class="select select-bordered select-sm" aria-label="Filtrar por riesgo de churn">
            <option value="">Todo riesgo de churn</option>
            {% for level in churn_levels %}
            <option value="{{ level.value }}" {{ "selected" if level.value == selected_churn }}>Churn {{ level.value | lower }}</option>
            {% endfor %}
        </select>
        <input type="search" id="customer-search" name="q" value="{{ query }}"
               placeholder="Buscar por nombre o email..."
               class="input input-bordered input-sm w-full sm:w-64" />
        <a href="/customers/export/csv" class="btn btn-outline btn-sm">
            Exportar a CSV
        </a>
    </form>
</div>

<div class="card bg-base-100 shadow-md">
    <div class="card-body p-0 overflow-x-auto">
        <table class="table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Empresa</th>
                    <th class="text-center">Lead score</th>
                    <th>Churn</th>
                    <th>Tags</th>
                </tr>
            </thead>
            <tbody id="customers-table-body">
                {% include "partials/customers_table.html" %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
