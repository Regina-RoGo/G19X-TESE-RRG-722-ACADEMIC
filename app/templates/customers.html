{% extends "base.html" %}

{% block title %}Clientes - CRM Inteligente{% endblock %}

{% block content %}
<div class="flex flex-wrap justify-between items-center gap-4 mb-4">
    <h1 class="text-2xl font-bold">Clientes</h1>

    <div class="flex flex-wrap items-center gap-2">
        <a href="/customers/export/csv" class="btn btn-outline btn-sm">
            Exportar a CSV
        </a>
        <input type="search" name="q" value="{{ query }}"
               placeholder="Buscar por nombre o email..."
               class="input input-bordered w-full sm:w-72"
               hx-get="/fragments/customers-table"
               hx-trigger="input changed delay:400ms, search"
               hx-target="#customers-table-body"
               hx-swap="innerHTML" />
    </div>
</div>

<div class="card bg-base-100 shadow-md">
    <div class="card-body p-0 overflow-x-auto">
        <table class="table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Empresa</th>
                </tr>
            </thead>
            <tbody id="customers-table-body">
                {% include "partials/customers_table.html" %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
