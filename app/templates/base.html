<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM Inteligente{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="min-h-screen bg-base-200">
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a href="/" class="btn btn-ghost text-xl">CRM Inteligente</a>
        </div>
        <div class="flex-none gap-1">
            <a href="/" class="btn btn-ghost {{ 'btn-active' if request.url.path == '/' else '' }}">Dashboard</a>
            <a href="/customers" class="btn btn-ghost {{ 'btn-active' if request.url.path.startswith('/customers') else '' }}">Clientes</a>
            <a href="/pipeline" class="btn btn-ghost {{ 'btn-active' if request.url.path.startswith('/pipeline') else '' }}">Pipeline</a>
            <a href="/tasks" class="btn btn-ghost {{ 'btn-active' if request.url.path.startswith('/tasks') else '' }}">Mis tareas</a>
        </div>
    </div>

    <main class="container mx-auto p-6">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
